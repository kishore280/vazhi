services:
  backend:
    build: ./backend  
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DSN: "postgresql+asyncpg://vazhi:vazhi_dev_password@postgres:5432/vazhi"
      REDIS_URL: "redis://redis:6379"
      MINIO_ENDPOINT: "rustfs:9000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      storage-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      milvus:
        condition: service_healthy
  postgres:
    image: postgres:16
    container_name: postgres-vazhi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: vazhi
      POSTGRES_PASSWORD: vazhi_dev_password
      POSTGRES_DB: vazhi
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vazhi"]
      interval: 10s
      start_period: 20s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      start_period: 20s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: vazhi
      RUSTFS_SECRET_KEY: vazhi_dev_password
    command: /data
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      start_period: 20s
      timeout: 5s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: "revision"
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd_data
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd_data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      start_period: 20s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.5.6
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: rustfs:9000
      MINIO_ACCESS_KEY_ID: vazhi
      MINIO_SECRET_ACCESS_KEY: vazhi_dev_password
      MILVUS_LOG_LEVEL: error
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      start_period: 90s
      timeout: 5s
      retries: 5
    depends_on:
      etcd:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  worker:
    build: ./backend
    command: arq worker_main.WorkerSettings
    environment:
      POSTGRES_DSN: "postgresql+asyncpg://vazhi:vazhi_dev_password@postgres:5432/vazhi"
      REDIS_URL: "redis://redis:6379"
      MINIO_ENDPOINT: "rustfs:9000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      storage-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      milvus:
        condition: service_healthy

  storage-migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrator
    environment:
      POSTGRES_DSN: "postgresql+asyncpg://vazhi:vazhi_dev_password@postgres:5432/vazhi"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  rustfs_data:
  etcd_data:
  milvus_data:
    
