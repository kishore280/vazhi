services:
  backend:
    build: ./backend  
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DSN: "postgresql+asyncpg://vazhi:vazhi_dev_password@postgres:5432/vazhi"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vazhi
      POSTGRES_PASSWORD: vazhi_dev_password
      POSTGRES_DB: vazhi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vazhi"]
      interval: 10s
      start_period: 20s
      timeout: 5s
      retries: 5

